name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Jede Auslieferung bekommt eine eigene Build-ID: sw.js ändert sich dadurch bei jedem Deployment, und die
      # Seite vergleicht den laufenden Stand mit version.json. Schlägt das Ersetzen fehl, bricht der Job ab.
      - name: Stamp build id
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/^const BUILD_ID = \"dev\";/const BUILD_ID = \"${BUILD}\";/" webapp/sw.js
          grep -q "^const BUILD_ID = \"${BUILD}\";" webapp/sw.js
          printf '{"build":"%s","time":"%s"}\n' "${BUILD}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > webapp/version.json
          cat webapp/version.json

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
