name: PWA JavaScript checks

on:
  pull_request:
    paths:
      - "webapp/**"
      - "tests/js/**"
      - ".github/workflows/test-js.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run PWA JavaScript tests
        run: node --test tests/js/*.test.mjs
